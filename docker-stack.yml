version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wa_sender_simple}
      POSTGRES_USER: ${POSTGRES_USER:-wa_sender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wa_sender}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wa_sender_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - wa_sender_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  app:
    image: wa-sender-simple:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: "${APP_URL:-https://wa2.supereducarbrasil.com.br}"
      BAILEYS_SESSION_DIR: /app/data/baileys-session
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-silent}
      DATABASE_URL: "${DATABASE_URL:-postgresql://wa_sender:wa_sender@wa_sender_simple_postgres:5432/wa_sender_simple?schema=public}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://wa2.supereducarbrasil.com.br}"
      REDIS_URL: "${REDIS_URL:-redis://wa_sender_simple_redis:6379}"
      WA2_INTERNAL_API_SECRET: "${WA2_INTERNAL_API_SECRET}"
      WA2_INTERNAL_API_PREVIOUS_SECRET: "${WA2_INTERNAL_API_PREVIOUS_SECRET:-}"
      WA2_INTERNAL_API_RATE_LIMIT: "${WA2_INTERNAL_API_RATE_LIMIT:-60}"
      WA2_INTERNAL_API_RATE_WINDOW_SECONDS: "${WA2_INTERNAL_API_RATE_WINDOW_SECONDS:-60}"
      WA2_INTERNAL_API_IDEMPOTENCY_TTL_SECONDS: "${WA2_INTERNAL_API_IDEMPOTENCY_TTL_SECONDS:-86400}"
    volumes:
      - baileys_session:/app/data/baileys-session
      - uploads:/app/uploads
    networks:
      - wa_sender_internal
      - iPHnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/internal/v1/health',{headers:{authorization:'Bearer '+process.env.WA2_INTERNAL_API_SECRET}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${APP_REPLICAS:-1}
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=iPHnet
        - traefik.http.routers.wa-sender-simple.rule=Host(`wa2.supereducarbrasil.com.br`)
        - traefik.http.routers.wa-sender-simple.entrypoints=websecure
        - traefik.http.routers.wa-sender-simple.tls=true
        - traefik.http.routers.wa-sender-simple.tls.certresolver=letsencryptresolver
        - traefik.http.services.wa-sender-simple.loadbalancer.server.port=3000

  worker:
    image: wa-sender-simple:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    command: npm run worker
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: "${APP_URL:-https://wa2.supereducarbrasil.com.br}"
      BAILEYS_SESSION_DIR: /app/data/baileys-session
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-silent}
      DATABASE_URL: "${DATABASE_URL:-postgresql://wa_sender:wa_sender@wa_sender_simple_postgres:5432/wa_sender_simple?schema=public}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://wa2.supereducarbrasil.com.br}"
      REDIS_URL: "${REDIS_URL:-redis://wa_sender_simple_redis:6379}"
    volumes:
      - baileys_session:/app/data/baileys-session
      - uploads:/app/uploads
    networks:
      - wa_sender_internal
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

networks:
  wa_sender_internal:
    driver: overlay
    attachable: true
  iPHnet:
    external: true
    name: iPHnet

volumes:
  postgres_data:
    external: true
    name: wa-sender-simple_postgres_data

  baileys_session:
    external: true
    name: wa-sender-simple_baileys_session

  uploads:
    external: true
    name: wa-sender-simple_uploads

  redis_data:
    name: wa-sender-simple_redis_data
