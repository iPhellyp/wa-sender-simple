services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: wa_sender_simple
      POSTGRES_USER: wa_sender
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    image: wa-sender-simple:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wa_sender}:${POSTGRES_PASSWORD:-wa_sender}@postgres:5432/${POSTGRES_DB:-wa_sender_simple}?schema=public
      REDIS_URL: redis://redis:6379
      BAILEYS_SESSION_DIR: /app/data/baileys-session
    depends_on:
      - postgres
      - redis
    volumes:
      - baileys_session:/app/data/baileys-session
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/internal/v1/health',{headers:{authorization:'Bearer '+process.env.WA2_INTERNAL_API_SECRET}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: wa-sender-simple:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: npm run worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wa_sender}:${POSTGRES_PASSWORD:-wa_sender}@postgres:5432/${POSTGRES_DB:-wa_sender_simple}?schema=public
      REDIS_URL: redis://redis:6379
      BAILEYS_SESSION_DIR: /app/data/baileys-session
    depends_on:
      - postgres
      - redis
    volumes:
      - baileys_session:/app/data/baileys-session
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
    name: wa-sender-simple_postgres_data
  baileys_session:
    name: wa-sender-simple_baileys_session
  uploads:
    name: wa-sender-simple_uploads
